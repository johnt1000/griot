name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release runs this whole workflow on the tagged commit before it builds.
  workflow_call:

# A new push supersedes the run still going for the same ref. Nothing here
# deploys, so cancelling in-flight work costs nothing and keeps the queue short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# What runs here is pinned (tests/test_supply_chain.py holds it so): an action
# is named by the commit it is, with its version beside it for a person to
# read, because a tag can be moved to other code by whoever owns the action;
# dependencies come from uv.lock, which has a hash for every package, and
# `--locked` stops the build when the lock no longer matches pyproject.toml.
# Dependabot (.github/dependabot.yml) proposes the updates of both, so each
# one arrives as a change to review instead of on its own. Raised by hand: the
# version of uv, of gitleaks (scripts/install-gitleaks.sh) and the runner
# images, named by version so that a new operating system is a decision here
# and not a date someone else picks.

jobs:
  test:
    # Every one of these names is a check main requires, as are `secret scan`,
    # `package builds and installs` and pr-text.yml's job (tests/test_pipeline.py
    # lists them all): renaming one leaves every pull request waiting for a
    # check that never comes.
    name: tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject (requires-python >= 3.10), a current
        # release and the newest. The floor is the one that actually catches
        # things: syntax and typing that only newer Pythons accept would
        # otherwise ship broken to anyone on the version the package claims
        # to support. macOS because its BSD tools behave differently from
        # GNU's, which has caused real defects in the git hooks.
        include:
          - {os: ubuntu-24.04, python: "3.10", label: py3.10}
          - {os: ubuntu-24.04, python: "3.13", label: py3.13}
          - {os: ubuntu-24.04, python: "3.14", label: py3.14}
          - {os: macos-15, python: "3.13", label: "macos, py3.13"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.6"
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra dev

      - name: Install gitleaks
        # The tests that run the git hooks with the real scanner are skipped
        # without it.
        run: |
          scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Run tests
        # No GRIOT_CONFIG_DIR/GRIOT_DATA_DIR here on purpose: tests/conftest.py
        # points both at a session tempdir before importing griot, and an
        # autouse fixture asserts after every test that the real XDG paths were
        # not touched. Setting them here would mask a regression in that guard.
        run: uv run --no-sync pytest -q

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: a credential removed in a later commit is still in
          # the repository until the history is rewritten, and shallow clone
          # would report the tree as clean while it sits one commit back.
          fetch-depth: 0

      - name: Install gitleaks
        run: scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"

      - name: Scan the history
        # Every ref, and the changes of merge commits too: `git log -p`, which
        # gitleaks reads, prints nothing for a merge unless asked, so whatever
        # a merge itself added was never scanned (scripts/audit-history.sh and
        # the pre-push hook ask the same).
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" git --no-banner --redact --config .gitleaks.toml
          --log-opts="--all --diff-merges=first-parent" .

  package:
    name: package builds and installs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.6"
          python-version: "3.13"
          enable-cache: true

      - name: Build
        # The build backend comes from the lock as well (the `build` group in
        # pyproject.toml), and without a matching hash nothing is installed.
        run: |
          uv export --locked --only-group build --output-file /tmp/build.txt
          uv build --build-constraints /tmp/build.txt --require-hashes

      - name: Check metadata
        run: |
          uv sync --locked --only-group build
          uv run --no-sync twine check dist/*

      - name: Install the wheel in a clean environment and run it
        # [real bug, 2026-08-21] A packaging defect once left files out of the
        # wheel while every test passed, because an editable install reads
        # them straight from the source tree. Installing the built artefact
        # somewhere with no source directory is the only thing that catches a
        # missing file or an undeclared dependency.
        # The wheel's dependencies are held to the versions (and hashes) of
        # the lock, like everything else this workflow installs.
        run: |
          uv export --locked --no-dev --no-emit-project --output-file /tmp/locked.txt
          uv venv /tmp/fresh
          uv pip install --python /tmp/fresh/bin/python --constraint /tmp/locked.txt dist/*.whl
          cd /tmp
          /tmp/fresh/bin/griot --version
          /tmp/fresh/bin/griot --help > /dev/null
          # keyring is a dependency (the OS keychain for credentials): a wheel
          # that stops declaring it would fall back to plaintext silently.
          /tmp/fresh/bin/python -c "import keyring"
        env:
          # Never let a smoke test write into the runner's real XDG paths.
          GRIOT_CONFIG_DIR: /tmp/griot-smoke/config
          GRIOT_DATA_DIR: /tmp/griot-smoke/data
