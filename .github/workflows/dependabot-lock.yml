name: Dependabot lock

# Dependabot writes uv.lock with its own uv, and two versions of uv write the
# same resolution with Python markers in different places: both forms pass
# `--locked`, and the next `uv lock` on the uv the workflows pin rewrites
# dozens of unrelated lines. On Dependabot's pull requests that change the
# lock, this rewrites it with the pinned uv and commits it to the pull request
# (tests/test_dependabot_lock.py holds every rule below).
#
# `pull_request`, never `pull_request_target` or `workflow_run`: the pull
# request's code never runs with the base repository's rights. A pull request
# from a fork gets a read-only token whatever this file asks for; one
# Dependabot opens here gets what `permissions:` grants (read-only by default).
#
# Two jobs, so that the one that can push runs nothing fetched:
# - `rewrite` has a read-only token. It runs the pinned uv on pyproject.toml
#   and uv.lock alone, building nothing (`--no-build`: no build backend runs,
#   no sdist's setup.py), and stops if the rewrite changed any version, source
#   or hash (scripts/lock-versions-unchanged.py): a commit nobody reads may
#   change how the lock is written, never what it installs.
# - `commit` holds `contents: write` and runs only git: it copies the file
#   `rewrite` produced and pushes it, never forced, so a branch that moved in
#   the meantime is left alone.
#
# A push made with this token starts no workflow without a person: GitHub
# creates the pull request's runs on the new commit in an approval-required
# state, and the checks main requires run once someone with write access
# chooses "Approve workflows to run" (CONTRIBUTING.md). The rewrite's own push
# does not start another rewrite: every job here runs only when Dependabot
# pushed last.
on:
  pull_request:
    paths: [uv.lock]

concurrency:
  group: dependabot-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rewrite:
    name: rewrite uv.lock with the pinned uv
    # Opened by Dependabot, from a branch of this repository: that is what
    # the trust rests on (the author of a pull request cannot be spoofed).
    # `github.actor` is whoever pushed last, which can be made to read
    # Dependabot, so it decides nothing here on its own; with `&&` it only
    # narrows: no rewrite on top of a person's push to Dependabot's branch,
    # and none after this workflow's own commit.
    if: >- # zizmor: ignore[bot-conditions] (narrows only; see above)
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.actor == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch's own commit, not the merge with main that
          # `pull_request` checks out: that is what gets pushed back.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.6"
          python-version: "3.13"
          enable-cache: false

      - name: Rewrite the lock
        # CONTRIBUTING's recipe: re-resolving only the project itself brings
        # the lock to the pinned uv's form with no pin moved.
        run: |
          cp uv.lock "$RUNNER_TEMP/before.lock"
          uv lock --upgrade-package griot-rag --no-build

      - name: Only how the lock is written changed
        run: python3 scripts/lock-versions-unchanged.py "$RUNNER_TEMP/before.lock" uv.lock

      - name: Anything to commit
        id: diff
        run: |
          if git diff --quiet -- uv.lock; then changed=false; else changed=true; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 1

  commit:
    name: commit the rewritten lock
    needs: rewrite
    # The same conditions as `rewrite`, repeated so that this job's rights
    # never rest on another job's `if`.
    if: >- # zizmor: ignore[bot-conditions] (narrows only; see rewrite)
      needs.rewrite.outputs.changed == 'true'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.actor == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to push the commit to the pull request's branch, and nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: uv-lock
          path: ${{ runner.temp }}/rewritten

      - name: Commit and push
        # The branch name and the token reach the shell through the
        # environment, never pasted into the script. `[dependabot skip]` lets
        # Dependabot keep rebasing its pull request (it stops once someone
        # else pushed to it otherwise); its next push is rewritten again.
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/rewritten/uv.lock" uv.lock
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "chore(deps): write uv.lock with the uv the workflows pin [dependabot skip]" -- uv.lock
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" push origin "HEAD:refs/heads/$BRANCH"
