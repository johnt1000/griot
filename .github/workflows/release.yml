name: Release

# A release is a tag: pushing `vX.Y.Z` first checks that the tag is the
# version the package declares, that the changelog has a section for it and
# that the tagged commit is on main, then runs the whole CI, builds the
# distribution from the lock, exactly as CI does, and publishes it to PyPI as
# `griot-rag` through trusted publishing: the publishing job is granted an
# OpenID token for that one step, and no API token lives in this repository.
# Everything that runs here is pinned, as in ci.yml (tests/test_supply_chain.py
# and tests/test_release.py hold it so).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One run per tag at a time, and none cancelled for the next: a re-run, or a
# tag deleted and pushed again, waits for the run in flight instead of
# publishing beside it, and cancelling the publishing job between the sdist
# and the wheel would leave on PyPI a version that can never be uploaded
# whole (PyPI refuses a file name it has seen). Not CI's group: a caller and
# the workflow it calls in one group would wait for each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: the tag is the version
    # First, and on its own: a tag is a name anyone can type, and checking it
    # takes seconds where the CI takes minutes (macOS included). Every other
    # job waits for this one, so a wrong tag stops the release before
    # anything else runs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The history of main, to tell whether the tagged commit is on it.
          fetch-depth: 0

      - name: The tag is the version
        # The script reads GITHUB_REF_NAME, which is the tag on a tag push.
        # Standard library only: nothing is installed before it runs.
        run: python3 scripts/release-check.py .

  ci:
    # The whole CI, on the tagged commit, before anything is built: main is
    # protected, but its owner can push past that, and a tag can point at a
    # commit that never went through a pull request.
    # A reusable workflow called at job level is loaded by GitHub from the
    # commit that is running, before the job has a workspace, so no step can
    # change what `./` names here (zizmor's self-repository finding is about
    # steps, where it could). Its own jobs keep their uv cache: nothing they
    # produce is published; the build below, which is, uses none.
    needs: tag
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository]

  build:
    name: build from the lock
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.6"
          python-version: "3.13"
          # No cache: an entry is written by other runs (every push to main) and
          # restored by key, so one poisoned entry would ship to PyPI. The build
          # resolves from the lock and the index every time.
          enable-cache: false

      - name: Build
        run: |
          uv export --locked --only-group build --output-file /tmp/build.txt
          uv build --build-constraints /tmp/build.txt --require-hashes

      - name: Check metadata
        run: |
          uv sync --locked --only-group build
          uv run --no-sync twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    # The environment is where the repository's settings can require a
    # reviewer before this job runs, and it is what PyPI's trusted publisher
    # is told to expect.
    environment: pypi
    permissions:
      id-token: write  # the OpenID token PyPI's trusted publishing exchanges for a one-time upload token
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
