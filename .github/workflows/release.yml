name: Release

# A release is a tag: pushing `vX.Y.Z` builds the distribution from the lock,
# exactly as CI does, checks that the tag is the version the package declares
# and that the changelog has a section for it, and publishes it to PyPI as
# `griot-rag` through trusted publishing: the publishing job is granted an
# OpenID token for that one step, and no API token lives in this repository.
# Everything that runs here is pinned, as in ci.yml (tests/test_supply_chain.py
# and tests/test_release.py hold it so).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build from the lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: The tag is the version
        # Before anything is built: a tag is a name anyone can type. The
        # script reads GITHUB_REF_NAME, which is the tag on a tag push.
        run: python3 scripts/release-check.py .

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.6"
          python-version: "3.13"
          enable-cache: true

      - name: Build
        run: |
          uv export --locked --only-group build --output-file /tmp/build.txt
          uv build --build-constraints /tmp/build.txt --require-hashes

      - name: Check metadata
        run: |
          uv sync --locked --only-group build
          uv run --no-sync twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment is where the repository's settings can require a
    # reviewer before this job runs, and it is what PyPI's trusted publisher
    # is told to expect.
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
