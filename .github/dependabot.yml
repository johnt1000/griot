# The build runs pinned code (see .github/workflows/ci.yml): actions by commit,
# dependencies from uv.lock. Pinned and never updated is its own risk, so the
# updates are proposed here, one reviewable change at a time.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One change for the routine ones; a major version comes on its own.
      minor-and-patch:
        update-types: ["minor", "patch"]
