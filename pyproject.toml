[build-system]
# >=77: license as an SPDX string + license-files are PEP 639 — setuptools
# 68-76 would satisfy a lower floor and fail metadata validation.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is `griot-rag`: `griot` on PyPI is somebody else's. The
# command and the import stay `griot`. The version here and in
# src/griot/__init__.py are one number (tests/test_release.py holds them to it),
# and a release is the tag `v<version>` (.github/workflows/release.yml).
name = "griot-rag"
version = "0.4.0"
description = "Local-first RAG over your git repositories — index code, git history and platform data (PRs/issues/releases) into an embedded vector store, search it and ask questions from the CLI or via MCP"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "johnt1000" }]
requires-python = ">=3.10"
keywords = ["rag", "vector-search", "git", "mcp", "mcp-server", "claude-code",
            "code-search", "semantic-search", "local-first", "developer-tools",
            "qdrant", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Text Processing :: Indexing",
]
# psutil: acquire_lock()/get_index_status() need Process.create_time() to
# detect PID recycling in the lock (see common.py).
# qdrant-edge-py: real in-process Qdrant engine — the default storage
# backend (not an optional prototype).
# mcp: MCP server SDK (`griot mcp`).
dependencies = [
    "requests",
    "tqdm",
    "python-dotenv",
    # fastembed only: the ONNX embedding runtime for the local profiles.
    # qdrant-client itself is never imported — the vector store is
    # qdrant-edge-py, in-process. Pulled through the extra rather than
    # depending on fastembed directly because that is how the pinned,
    # compatible pairing is published.
    "qdrant-client[fastembed]",
    "psutil",
    # Both of the next two are held below the version that may change their
    # interface (a minor one before 1.0, a major one after): griot calls them
    # directly all over, and an installation made the day after such a release
    # would otherwise get code nobody ran against it. Raised on purpose, with
    # the suite green on the new version. 0.8.0 is the oldest qdrant-edge-py
    # the suite has ever run on, so it is the floor.
    "qdrant-edge-py>=0.8.0,<0.9",
    "mcp>=2.0.0,<3",
    # Declared explicitly although pydantic already pulls it in: mcp_server.py
    # imports TypedDict from here because pydantic rejects typing.TypedDict on
    # Python < 3.12, and relying on a transitive dependency for something this
    # module cannot import without would break on any resolution that drops it.
    "typing-extensions>=4.6",
    # Same reasoning as typing-extensions: mcp_server.py imports BaseModel from
    # pydantic directly, so it must not rely on `mcp` continuing to pull it in.
    "pydantic>=2",
    # And again: mcp_server.py waits with anyio.sleep (the MCP SDK's own async
    # layer), which it imports directly.
    "anyio",
    # OS keychain storage for credentials (macOS Keychain / Linux Secret
    # Service / Windows Credential Manager). A default dependency since debt
    # 65: as an opt-in extra, `pipx install griot-rag` (the documented
    # install) kept every key in plaintext. common.py's keychain wrappers
    # still degrade to <config>/.env (0600) where no backend is reachable
    # (headless Linux without a Secret Service, a container, CI), and
    # `griot auth` / `griot doctor` say so.
    "keyring>=24",
]

[project.optional-dependencies]
# packaging, tomli and pyyaml: imported by tests/test_supply_chain.py. Other
# packages bring them today; named for the same reason as typing-extensions
# above.
dev = ["pytest", "packaging", "pyyaml", "tomli; python_version < '3.11'"]
# Empty on purpose: keyring is a default dependency now, and the extra stays
# so the command older docs gave (`pip install "griot-rag[keychain]"`) keeps
# installing without pip's "does not provide the extra" warning.
keychain = []

# What the packaging job of the CI runs: the build backend that [build-system]
# names, and the metadata checker. They are here so that uv.lock pins them
# with a hash, like every other dependency, and Dependabot proposes their
# updates; the job hands the lock to the build as a constraint. Not an extra:
# nobody installing griot needs them.
[dependency-groups]
build = ["setuptools>=77", "twine"]

[project.urls]
Homepage = "https://github.com/johnt1000/griot"
Repository = "https://github.com/johnt1000/griot"
Issues = "https://github.com/johnt1000/griot/issues"
Changelog = "https://github.com/johnt1000/griot/blob/main/CHANGELOG.md"

[project.scripts]
griot = "griot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Without this, the bundled skill/agent .md files under resources/ (see
# harnesses.py) work in an editable install (files are read straight off the
# source tree) but are silently OMITTED from a real built wheel — `pip
# install griot` outside this dev checkout would ship `griot assist install`
# with nothing to install.
[tool.setuptools.package-data]
griot = ["resources/skills/**/*.md", "resources/agents/**/*.md", "resources/instructions/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "as_every_other_test: in a file that lifts one of conftest's guards, a test that keeps the guard",
]
